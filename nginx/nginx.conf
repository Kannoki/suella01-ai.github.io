worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ────────────────────────────────────────────────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log  warn;

    # ── Performance ────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    gzip               on;
    gzip_types         text/plain text/css application/json application/javascript
                       text/xml application/xml application/xml+rss text/javascript
                       image/svg+xml;
    gzip_min_length    1000;

    # ── Upstream: Next.js app ──────────────────────────────────────────────
    upstream nextjs {
        server web:3000;
        keepalive 32;
    }

    # ── HTTP → HTTPS redirect ──────────────────────────────────────────────
    # Uncomment this block after setting up TLS certificates.
    #
    # server {
    #     listen 80;
    #     server_name yourdomain.com www.yourdomain.com;
    #     return 301 https://$host$request_uri;
    # }

    # ── Main server block ──────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;   # Replace with your domain, e.g. mechgirl.com

        # ── Security headers ──────────────────────────────────────────────
        add_header X-Frame-Options          "SAMEORIGIN"  always;
        add_header X-Content-Type-Options   "nosniff"     always;
        add_header X-XSS-Protection         "1; mode=block" always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

        # ── Static assets: served directly by Nginx (fast) ───────────────
        location /_next/static/ {
            proxy_pass         http://nextjs;
            proxy_cache_valid  200 365d;
            add_header         Cache-Control "public, max-age=31536000, immutable";
        }

        location /asset/ {
            alias  /app/public/asset/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        location /favicon.ico {
            alias  /app/public/favicon.ico;
            expires 30d;
        }

        # ── Proxy everything else to Next.js ──────────────────────────────
        location / {
            proxy_pass             http://nextjs;
            proxy_http_version     1.1;
            proxy_set_header       Upgrade          $http_upgrade;
            proxy_set_header       Connection       "upgrade";
            proxy_set_header       Host             $host;
            proxy_set_header       X-Real-IP        $remote_addr;
            proxy_set_header       X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto $scheme;
            proxy_read_timeout     60s;
            proxy_connect_timeout  10s;
            proxy_send_timeout     60s;
            client_max_body_size   10m;
        }

        # ── TLS (HTTPS) — uncomment and adjust after Certbot setup ───────
        # listen 443 ssl http2;
        # ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
        # ssl_protocols       TLSv1.2 TLSv1.3;
        # ssl_ciphers         HIGH:!aNULL:!MD5;
    }
}
