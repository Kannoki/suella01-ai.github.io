version: "3.9"

# ─── Networks ───────────────────────────────────────────────────────────────
networks:
  app_net:
    driver: bridge

# ─── Services ───────────────────────────────────────────────────────────────
services:

  # ── Next.js Web App ──────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
    networks:
      - app_net
    expose:
      - "3000"
    command: ["node", "server.js"]

  # ── Nginx Reverse Proxy ──────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Nginx config
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Serve public assets directly (optional performance boost)
      - ./public:/app/public:ro
      # TLS certificates (bind-mount Certbot output here on VPS)
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
